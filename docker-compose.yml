version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/health_dashboard.db
    env_file:
      - ./backend/.env
    volumes:
      - ./data:/app/data
      - ./backend/credentials.json:/app/credentials.json:ro
      - ./backend/token.json:/app/token.json
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python run_bot.py
    env_file:
      - ./backend/.env
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
